<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nahidul Islam Chonjury — Chemical and Process Engineer · Electrochemical Engineer</title>
<style>
:root{
  --text:#512324; --dark:#512324; --muted:#6b5556; --link:#763242; --link-hover:#512324; --accent-bg:#EEEEEE;
  --border:#e2dad6; --border2:#D7CEC9; --footer:#512324;
  --font:-apple-system,BlinkMacSystemFont,"Roboto","Segoe UI","Helvetica Neue","Lucida Grande",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
@media (min-width:48em){html{font-size:17px}}
body{font-family:var(--font);color:var(--text);line-height:1.6;background:#fff;display:flex;flex-direction:column;min-height:100vh}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover);text-decoration:underline}

/* masthead */
.masthead{border-top:3px solid var(--link);border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:10}
.masthead .inner{max-width:1280px;margin:0 auto;padding:14px 2em;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.site-title{font-weight:700;color:var(--dark);font-size:1.05em;margin-right:auto}
.site-title:hover{text-decoration:none;color:#000}
.nav{display:flex;gap:4px 22px;list-style:none;flex-wrap:wrap}
.nav a{color:var(--muted);font-size:.9em;padding:4px 0;border-bottom:2px solid transparent}
.nav a:hover{text-decoration:none;color:var(--dark)}
.nav a.active{color:var(--link);border-color:var(--link)}
.toggle{display:none;background:none;border:0;font-size:1.4em;color:var(--dark);cursor:pointer}

/* layout */
.main{max-width:1280px;margin:0 auto;padding:2em;display:grid;grid-template-columns:250px 1fr;gap:3em;flex:1;width:100%}
.sidebar{position:sticky;top:90px;align-self:start}
.avatar{width:175px;height:175px;border-radius:50%;border:2px solid var(--link);padding:5px;background:#fff}
.avatar img,.avatar div{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar div{background:var(--accent-bg);display:grid;place-items:center;font-size:3em;color:var(--link);font-weight:300}
.sidebar h3{color:var(--dark);font-size:1.25em;margin:.8em 0 .2em;line-height:1.3}
.sidebar .bio{font-size:.82em;font-style:italic;color:var(--muted)}
.links{list-style:none;margin-top:1em;font-size:.82em}
.links li{display:flex;align-items:center;gap:8px;padding:3px 0;color:var(--text)}
.links svg{width:15px;height:15px;flex:none;fill:var(--link)}
.links a{color:var(--text)}
.links a:hover{color:var(--link)}

/* content */
.page h1{font-size:2em;color:var(--dark);line-height:1.25;margin-bottom:.6em}
.page h2{font-size:1.4em;color:var(--link);margin:1.6em 0 .6em;padding-bottom:.4em;border-bottom:2px solid var(--accent-bg)}
.page h3{font-size:1.1em;color:var(--dark);margin:1.2em 0 .3em}
.page p{margin-bottom:1em}
.page ul{margin:0 0 1em 1.4em}
.page li{margin-bottom:.35em}
.note{background:var(--accent-bg);border-left:3px solid var(--link);padding:.7em 1em;margin:0 0 1.4em;font-size:.92em}
.news li{list-style:none;margin-left:-1.4em}
.news b{color:var(--dark);display:inline-block;min-width:90px;font-weight:600}
.item{margin-bottom:1.3em}
.item .t{font-weight:600;color:var(--dark)}
.item .m{font-size:.9em;color:var(--muted)}
.item .d{font-size:.95em;margin-top:.2em}
.pub{margin-bottom:1.1em;font-size:.97em}
.pub .j{font-style:italic}
.pub a{font-size:.9em;margin-right:8px}
.row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.row .when{color:var(--muted);font-size:.9em;white-space:nowrap}
.post-list .item .t a{color:var(--dark)}
.post-list .item .t a:hover{color:var(--link)}
.back{font-size:.9em;display:inline-block;margin-bottom:1em}
.pagebar{margin-top:2.5em;padding-top:1em;border-top:1px solid var(--border);font-size:.85em;color:var(--muted)}
.pagebar a{color:var(--muted)}
.pagebar a:hover{color:var(--link)}
.btn{display:inline-block;padding:.45em 1em;border:1px solid var(--border2);border-radius:4px;color:var(--dark);font-size:.9em}
.btn:hover{text-decoration:none;background:#f6f3f1}
.skills td{padding:.35em 1em .35em 0;vertical-align:top;font-size:.95em}
.skills td:first-child{font-weight:600;color:var(--dark);white-space:nowrap}

.hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:1.2em}
.hl-card{border:1px solid #ddd3ce;border-radius:10px;overflow:hidden;background:#fff}
.hl-head{background:var(--link);color:#fff;font-weight:600;padding:.6em 1em;font-size:.98em}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:1em}
.chip{background:var(--accent-bg);color:var(--link);border:1px solid #ddd3ce;border-radius:20px;padding:.25em .8em;font-size:.86em;font-weight:500}
.cert-grid{display:grid;grid-template-columns:1fr;gap:12px}
.cert .cd{font-size:.9em;color:#5a4546;margin-top:4px;line-height:1.5}
.cert{display:flex;gap:14px;align-items:flex-start;border:1px solid #ddd3ce;border-left:4px solid var(--link);border-radius:8px;padding:1em;background:#fff}
.cert.award{border-left-color:#9c7a5c}
.cert-ico{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent-bg);display:grid;place-items:center}
.cert-ico svg{width:20px;height:20px;fill:var(--link)}
.cert.award .cert-ico{background:#EEEEEE}.cert.award .cert-ico svg{fill:#9c7a5c}
.cert .t{font-weight:600;color:var(--dark);line-height:1.35}
.cert .m{font-size:.86em;color:var(--muted);margin-top:2px}
.badge{display:inline-block;margin-top:6px;font-size:.78em;font-weight:600;color:var(--link);background:var(--accent-bg);border-radius:4px;padding:1px 8px}
.cert.award .badge{color:#6b5556;background:#EEEEEE}

.gs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:.6em}
.gs-btn{display:inline-flex;align-items:center;gap:8px;background:var(--link);color:#fff;padding:.55em 1.1em;border-radius:6px;font-weight:600;font-size:.92em}
.gs-btn:hover{color:#fff;text-decoration:none;background:var(--link-hover)}
.gs-btn svg{width:18px;height:18px;fill:#fff}
.gs-stats{border-collapse:collapse;font-size:.88em;min-width:200px}
.gs-stats th,.gs-stats td{padding:4px 12px;text-align:right;border-bottom:1px solid var(--border)}
.gs-stats th{color:var(--muted);font-weight:500}
.gs-stats td:first-child{text-align:left;color:var(--link)}
.gs-note{font-size:.85em;color:var(--muted)}
table.gs{width:100%;border-collapse:collapse;margin-top:.6em}
table.gs th{font-size:.75em;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--border2)}
table.gs th a{color:var(--muted)}
table.gs th a.on{color:var(--link);text-decoration:underline}
table.gs td{padding:12px 6px;border-bottom:1px solid var(--border);vertical-align:top}
table.gs .n{text-align:right;width:80px;white-space:nowrap}
table.gs td.n{font-size:.92em;color:var(--text)}
.gs-t{font-size:1em;font-weight:500;line-height:1.35;display:inline-block;margin-bottom:3px}
.gs-g{font-size:.84em;color:#6b5556;line-height:1.4}
.proj-list{display:grid;gap:18px}
.proj{border:1px solid #ddd3ce;border-left:4px solid var(--link);border-radius:8px;padding:1.1em 1.2em;background:#fff}
.proj .t{font-weight:600;color:var(--dark);font-size:1.05em}
.proj .m{font-size:.88em;color:var(--muted)}
.proj .d{margin-top:.4em}
.proj-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:.8em}
.proj-imgs img{width:100%;height:140px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.chips.sm{padding:.6em 0 0}
.chips.sm .chip{font-size:.78em}
.proj-files{display:flex;flex-wrap:wrap;gap:10px;margin-top:.7em}
.proj-files a{display:inline-flex;align-items:center;gap:6px;font-size:.88em;border:1px solid #ddd3ce;border-radius:6px;padding:.3em .7em}
.proj-files svg{width:15px;height:15px;fill:var(--link)}
@media (max-width:600px){table.gs .n{width:50px}}

/* scene: shown on About Me only */
footer{margin-top:3em}
/* scene: electrochemistry + process control */
.scene{margin:0;line-height:0;border-bottom:1px solid #D7CEC9}
.scene svg{display:block;width:100%;height:auto;aspect-ratio:1440/260;max-height:300px}
.scene .lbl{font:600 11px Inter,system-ui,sans-serif;fill:#fff;text-anchor:middle;letter-spacing:.02em}
.scene .lbl.dark{fill:#763242;font-size:10px;letter-spacing:.08em}
.scene .scr{font:600 8.5px ui-monospace,monospace;fill:#9fc3ee;letter-spacing:.04em}
.scene .scr.g{fill:#5fd39b}
.scene .isa circle{fill:#fff;stroke:#763242;stroke-width:2}
.scene .isa line{stroke:#763242;stroke-width:1.5}
.scene .isa text{font:700 8.5px Inter,system-ui,sans-serif;fill:#763242;text-anchor:middle}
.scene .isa text.tag{font-weight:500;font-size:7px}
.scene .lbl.s{font-size:8.5px;letter-spacing:.08em}
.scene .lbl.dark2{fill:#763242}
.scene .scr.c{text-anchor:middle}
.dc{animation:blink 3s infinite}
.bb{fill:#ffffff;opacity:.9;animation:bub 2.4s linear infinite}
.bb.b1{animation-delay:.6s}.bb.b2{animation-delay:1.2s}.bb.b3{animation-delay:1.8s}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.95}100%{transform:translateY(-52px);opacity:0}}
.glint{opacity:0;animation:glint 6s infinite}
.glint.g1{animation-delay:2s}.glint.g2{animation-delay:4s}
@keyframes glint{0%,80%,100%{opacity:0}88%{opacity:.9}}
.blades2{transform-box:view-box;transform-origin:168px 96px;animation:spin 5s linear infinite}
.flow.rev{animation-direction:normal}
.ion.i1{animation-delay:.7s}.ion.i2{animation-delay:1.4s}
.soc,.tk1{transform-box:fill-box;transform-origin:left bottom;animation:socx 8s ease-in-out infinite alternate}
.soc{transform-origin:left center}
.tk1{animation-name:socy}.tk2{transform-box:fill-box;transform-origin:center bottom;animation:socy 8s ease-in-out infinite alternate-reverse}
@keyframes socx{0%{transform:scaleX(.25)}100%{transform:scaleX(1)}}
@keyframes socy{0%{transform:scaleY(.4)}100%{transform:scaleY(1)}}
.flow{stroke-dasharray:6 9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-30}}
.sig{animation:flow 1.6s linear infinite}
.imp{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.blades{transform-box:view-box;transform-origin:40px 118px;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ion{fill:#ffc94a;animation:cross 2.2s ease-in-out infinite}
.ion.i2{animation-delay:.7s}.ion.i3{animation-delay:1.4s}
@keyframes cross{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(30px);opacity:0}}
.charge{transform-box:fill-box;transform-origin:left center;animation:chg 5s ease-in-out infinite}
@keyframes chg{0%{transform:scaleX(.15)}80%,100%{transform:scaleX(1)}}
.lvlA,.lvlB{animation:lvl 8s ease-in-out infinite alternate}
.lvlB{animation-delay:-4s}
.lvlC{transform-box:fill-box;transform-origin:center bottom;animation:lvl2 6s ease-in-out infinite alternate}
@keyframes lvl{to{transform:translateY(10px)}}
@keyframes lvl2{0%{transform:scaleY(.55)}100%{transform:scaleY(1)}}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 6s ease-out infinite}
.draw.d2{animation-delay:1.5s}
@keyframes draw{0%{stroke-dashoffset:420}55%,100%{stroke-dashoffset:0}}
.blink{fill:#ff5a5a;animation:blink 2.4s infinite}
.blink.b2{animation-delay:1.1s}
@keyframes blink{0%,60%,100%{opacity:1}70%,90%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}.draw{stroke-dashoffset:0}}
@media (max-width:759px){.scene svg{height:190px;aspect-ratio:auto}}

.avatar{width:220px;height:293px;border-radius:10px;border:1px solid #D7CEC9;padding:6px;background:#fff;box-shadow:0 6px 18px -10px rgba(81,35,36,.45)}
.avatar img,.avatar div{border-radius:6px}
.avatar img{object-position:center top}
.avatar div{font-size:3.6em}
@media (max-width:860px){.sidebar{grid-template-columns:120px 1fr}.avatar{width:120px;height:160px;padding:4px;border-radius:8px}}

/* education roadmap */
.rm-intro{color:var(--muted)!important;margin-top:-.4em}
.roadmap{position:relative;padding-left:64px;margin-top:1.4em}
.roadmap::before{content:"";position:absolute;left:23px;top:10px;bottom:30px;width:4px;border-radius:4px;background:linear-gradient(#763242,#C1A081)}
.rm-step{position:relative;margin-bottom:26px}
.rm-node{position:absolute;left:-64px;top:6px;width:50px;height:50px;border-radius:50%;background:#763242;color:#fff;font-weight:700;font-size:1.15em;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 0 0 2px #C1A081}
.rm-step.current .rm-node{background:#C1A081;color:#512324;box-shadow:0 0 0 2px #763242,0 0 0 8px rgba(193,160,129,.25);animation:rmPulse 2.4s ease-in-out infinite}
@keyframes rmPulse{50%{box-shadow:0 0 0 2px #763242,0 0 0 13px rgba(193,160,129,0)}}
.rm-card{position:relative;background:#fff;border:1px solid #e2dad6;border-radius:12px;padding:16px 18px;box-shadow:0 6px 18px -14px rgba(81,35,36,.45)}
.rm-card::before{content:"";position:absolute;left:-9px;top:22px;width:16px;height:16px;background:#fff;border-left:1px solid #e2dad6;border-bottom:1px solid #e2dad6;transform:rotate(45deg)}
.rm-step.current .rm-card{border-color:#C1A081}
.rm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.rm-level{font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9c7a5c}
.rm-year{font-size:.82em;font-weight:600;color:#763242;background:#f6f3f1;border:1px solid #e2dad6;border-radius:20px;padding:2px 10px}
.rm-title{font-weight:700;color:#512324;font-size:1.08em}
.rm-now{display:inline-block;font-size:.66em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:#763242;border-radius:4px;padding:2px 7px;vertical-align:middle;margin-left:6px}
.rm-org{color:var(--muted);font-size:.92em;margin-top:2px}
.rm-desc{font-size:.9em;color:#2C1B1C;margin-top:8px;line-height:1.55}
.rm-end{position:relative;height:28px}
.rm-end::before{content:"";position:absolute;left:-46px;top:2px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid #763242}
.rm-end span{font-size:.85em;font-style:italic;color:var(--muted)}
@media (max-width:600px){.roadmap{padding-left:50px}.roadmap::before{left:17px}.rm-node{left:-50px;width:40px;height:40px;font-size:1em}.rm-end::before{left:-40px}}

.rm-card{display:flex;gap:16px;align-items:flex-start}
.rm-body{flex:1;min-width:0}

/* roadmap nodes: plain dots, no numbers */
.rm-node{left:-52px!important;top:20px!important;width:26px!important;height:26px!important;font-size:0!important;border-width:5px!important}
.rm-step.current .rm-node{background:#C1A081}
@media (max-width:600px){.rm-node{left:-42px!important;width:22px!important;height:22px!important}}

@media (max-width:600px){
  .roadmap{padding-left:34px}
  .roadmap::before{left:9px}
  .rm-node{left:-34px!important;width:20px!important;height:20px!important;border-width:4px!important}
  .rm-card{flex-direction:column;gap:10px;padding:14px}
}

      excerpt:"Completed my B.Sc. in Chemical Engineering at KUET with a CGPA of 3.75, securing the 2nd merit position in my department.",
      body:`<p>Alhamdulillah! I have successfully completed my undergraduate degree, Bachelor of Science in Chemical Engineering with a CGPA of 3.75, securing the 2nd merit position in my department. All praise and gratitude to the Almighty, who guided and strengthened me through every challenge.</p>
            <p>I would like to dedicate this achievement to my beloved parents and my younger brother, whose unwavering love, prayers, and constant support made this journey possible.</p>
            <p>My undergraduate thesis was titled:<br><em>“Fabrication of Ti₃C₂Tₓ MXene–Graphene Oxide (GO) Composite Electrode and Its Characterization.”</em><br>Heartfelt thanks to my supervisor, <a href="https://www.linkedin.com/in/mamun-jamal-08009417/" target="_blank" rel="noopener">Mamun Jamal</a> (Dr. A.B.M Mamun Jamal) sir, for his invaluable guidance and mentorship.</p>
            <p>This journey has brought many people into my life — some stayed, some left — but each left an impact, whether good or bad, and for that, I’m truly grateful.</p>` },

  atom:'<path d="M12 10.2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zM12 2c-1.7 0-3 2.6-3.6 6.2C5 9 2.7 10.4 2.7 12s2.3 3 5.7 3.8C9 19.4 10.3 22 12 22s3-2.6 3.6-6.2c3.4-.8 5.7-2.2 5.7-3.8s-2.3-3-5.7-3.8C15 4.6 13.7 2 12 2zm0 2c.7 0 1.5 1.6 2 4-.6-.1-1.3-.1-2-.1s-1.4 0-2 .1c.5-2.4 1.3-4 2-4zm0 6c.9 0 1.8 0 2.5.1.1.6.1 1.2.1 1.9s0 1.3-.1 1.9c-.7.1-1.6.1-2.5.1s-1.8 0-2.5-.1c-.1-.6-.1-1.2-.1-1.9s0-1.3.1-1.9C10.2 10 11.1 10 12 10zm-4.3.4c0 .5-.1 1-.1 1.6s0 1.1.1 1.6C5.6 13 4.7 12.4 4.7 12s.9-1 3-1.6zm8.6 0c2.1.6 3 1.2 3 1.6s-.9 1-3 1.6c0-.5.1-1 .1-1.6s0-1.1-.1-1.6zM10 16c.6.1 1.3.1 2 .1s1.4 0 2-.1c-.5 2.4-1.3 4-2 4s-1.5-1.6-2-4z"/>',
  plant:'<path d="M2 21V10l5 3V10l5 3V10l5 3V3h4v18H2zm4-4h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"/>',
  code:'<path d="M8.7 16.6 4.1 12l4.6-4.6L7.3 6 1.3 12l6 6 1.4-1.4zm6.6 0 4.6-4.6-4.6-4.6L16.7 6l6 6-6 6-1.4-1.4z"/>',
  tools:'<path d="M22.6 18.6 13.5 9.5c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3l4.3 4.3-3 3-4.4-4.3C.4 6.7.9 9.7 2.9 11.7c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.4-.4.4-1.1 0-1.4z"/>',
  cert:'<path d="M12 1 3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4zm-1.5 15.5-4-4 1.4-1.4 2.6 2.6 6.1-6.1 1.4 1.4-7.5 7.5z"/>',
  award:'<path d="M19 3h-2V1H7v2H5a2 2 0 0 0-2 2v2a5 5 0 0 0 4.3 4.95A5 5 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5 5 0 0 0 3.7-3.95A5 5 0 0 0 21 7V5a2 2 0 0 0-2-2zM5 7V5h2v4.8A3 3 0 0 1 5 7zm14 0a3 3 0 0 1-2 2.8V5h2v2z"/>',
  cv:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 13h8v2H8zm0 4h8v2H8z"/>'
};
const LABEL = { linkedin:"LinkedIn", scholar:"Google Scholar", researchgate:"ResearchGate", orcid:"ORCID", github:"GitHub", youtube:"YouTube", facebook:"Facebook" };
const ico = k => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
const ext = u => `href="${u}" target="_blank" rel="noopener"`;

/* static parts */
$('#siteTitle').textContent = DATA.name;
$('#footName').textContent = DATA.name;
$('#yr').textContent = new Date().getFullYear();
const initials = DATA.name.split(' ').filter((w,i,a)=>i===0||i===a.length-1).map(w=>w[0]).join('');
const socials = Object.entries(DATA.links).filter(([,u])=>u);
$('#sidebar').innerHTML = `
  <div class="avatar">${DATA.photo?`<img src="${DATA.photo}" alt="${DATA.name}">`:`<div>${initials}</div>`}</div>
  <div><h3>${DATA.name}</h3><div class="bio">${DATA.bio}</div></div>
  <ul class="links">
    <li>${ico('location')}${DATA.location}</li>
    <li>${ico('employer')}${DATA.employer}</li>
    <li>${ico('email')}<a href="mailto:${DATA.email}">${DATA.email}</a></li>
    ${socials.map(([k,u])=>`<li class="li-${k}">${ico(k)}<a ${ext(u)}>${LABEL[k]}</a></li>`).join('')}
    ${DATA.cv?`<li>${ico('cv')}<a ${ext(DATA.cv)}>CV (PDF)</a></li>`:''}
  </ul>`;
$('#follow').innerHTML = `<b>Follow:</b>${socials.map(([k,u])=>`<a ${ext(u)}>${ico(k)}${LABEL[k]}</a>`).join('')}<a href="mailto:${DATA.email}">${ico('email')}Email</a>`;

/* pages */
const fmt = d => new Date(d+'T00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const items = arr => arr.map(x=>`<div class="item"><div class="row"><span class="t">${x.title}</span><span class="when">${x.when||''}</span></div>${x.org||x.issuer?`<div class="m">${x.org||x.issuer}</div>`:''}${x.desc?`<div class="d">${x.desc}</div>`:''}${x.link?`<a ${ext(x.link)} style="font-size:.9em">View →</a>`:''}</div>`).join('');
const pubLinks = p => [
    p.doi ? `<a ${ext('https://doi.org/'+p.doi)}>[DOI]</a>` : '',
    p.arxiv ? `<a ${ext('https://arxiv.org/abs/'+p.arxiv)}>[arXiv]</a>` : '',
    `<a ${ext('https://scholar.google.com/scholar?q='+encodeURIComponent('"'+p.title+'"'))}>[Google Scholar]</a>`
  ].join('');
const pubItem = (p,i) => `<div class="pub">${i+1}. ${p.authors.replace('Islam, M.N.','<b>Islam, M.N.</b>')} (${p.year}). "${p.title}." <span class="j">${p.venue}</span>${p.details?', '+p.details:''}. ${pubLinks(p)}</div>`;
const pubs = type => DATA.publications.filter(p=>!type||p.type===type).map(pubItem).join('');

const logoBox = r => r.logo ? `<div class="org-logo${r.logoWide?' wide':''}"><img src="${r.logo}" alt=""></div>` : r.mono ? `<div class="org-logo mono">${r.mono}</div>` : '';
const resItem = r => `<div class="item${(r.logo||r.mono)?' with-logo':''}">${logoBox(r)}<div class="item-body"><div class="row"><span class="t">${r.title}</span><span class="when">${r.when}</span></div><div class="m">${r.org}</div>${r.desc?`<div class="d">${r.desc}</div>`:''}</div></div>`;
const pubUrl = p => p.doi ? 'https://doi.org/'+p.doi : p.arxiv ? 'https://arxiv.org/abs/'+p.arxiv : 'https://scholar.google.com/scholar?q='+encodeURIComponent('"'+p.title+'"');
let pubSort = 'year';
function scholarTable(){
  const list=[...DATA.publications].sort((a,b)=> pubSort==='cites' ? (b.cites||0)-(a.cites||0) || b.year-a.year : b.year-a.year || (b.cites||0)-(a.cites||0));
  return `<table class="gs">
    <thead><tr><th>Title</th><th class="n"><a href="#publications" data-sort="cites" class="${pubSort==='cites'?'on':''}">Cited by</a></th><th class="n"><a href="#publications" data-sort="year" class="${pubSort==='year'?'on':''}">Year</a></th></tr></thead>
    <tbody>${list.map(p=>`<tr>
      <td><a class="gs-t" ${ext(pubUrl(p))}>${p.title}</a>
        <div class="gs-g">${p.authors.replace('Islam, M.N.','<b>Islam, M.N.</b>')}</div>
        <div class="gs-g">${p.venue}${p.details?', '+p.details:''}${p.type==='conference'?' · <i>conference</i>':''}</div></td>
      <td class="n">${p.cites?`<a ${ext(DATA.links.scholar)}>${p.cites}</a>`:''}</td>
      <td class="n">${p.year}</td></tr>`).join('')}</tbody></table>`;
}
const PAGES = {
  about: { nav:"About Me", render:()=>`
    <h1>${DATA.name}</h1>
    <h2>About Me</h2>
    ${DATA.about.map(p=>p.startsWith('<')?p:`<p>${p}</p>`).join('')}` },
  education: { nav:"Education", render:()=>{
    const steps=[...DATA.education];
    const lvl=['Graduate','Undergraduate','College','School'];
    return `<h1>Education</h1><p class="rm-intro">My academic journey, step by step.</p>
    <div class="roadmap">${steps.map((e,i)=>{const cur=/expected|present/i.test(e.when);return `
      <div class="rm-step${cur?' current':''}">
        <div class="rm-node"></div>
        <div class="rm-card">${logoBox(e)}<div class="rm-body">
          <div class="rm-top"><span class="rm-level">${lvl[i]||''}</span><span class="rm-year">${e.when}</span></div>
          <div class="rm-title">${e.title}${cur?' <span class="rm-now">In progress</span>':''}</div>
          <div class="rm-org">${e.org}</div>
          ${e.desc?`<div class="rm-desc">${e.desc}</div>`:''}
        </div></div>
      </div>`}).join('')}
    </div>`;} },
  research: { nav:"Research", render:()=>`<h1>Research</h1>
    <h2>Research Interests</h2><ul>${DATA.interests.map(i=>`<li>${i}</li>`).join('')}</ul>
    <h2>Research Experience</h2>${DATA.researchExp.map(resItem).join('')}` },
  experience: { nav:"Experience", render:()=>`<h1>Experience</h1>
    <h2>Teaching Experience</h2>${DATA.teaching.map(resItem).join('')}
    <h2>Industrial Experience</h2>${DATA.industry.map(resItem).join('')}` },
  projects: { nav:"Projects", render:()=>`<h1>Projects</h1>
    <div class="proj-list">${DATA.projects.map(p=>`<div class="proj">
      ${p.images&&p.images.length?`<div class="proj-imgs">${p.images.map(src=>`<img src="${src}" alt="${p.title}">`).join('')}</div>`:''}
      <div class="row"><span class="t">${p.title}</span><span class="when">${p.when}</span></div>
      <div class="m">${p.org}</div>
      <div class="d">${p.desc}</div>
      ${p.tags&&p.tags.length?`<div class="chips sm">${p.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div>`:''}
      ${p.files&&p.files.length?`<div class="proj-files">${p.files.map(f=>`<a ${ext(f.url)}>${ico('cv')}${f.name}</a>`).join('')}</div>`:''}
    </div>`).join('')}</div>` },
  publications: { nav:"Publications", render:()=>`<h1>Publications</h1>
    <div class="gs-top">
      <a class="gs-btn" ${ext(DATA.links.scholar)}>${ico('scholar')} View on Google Scholar</a>
      <table class="gs-stats"><tr><th></th><th>All</th></tr>
        <tr><td>Citations</td><td>${DATA.scholarStats.citations}</td></tr>
        <tr><td>h-index</td><td>${DATA.scholarStats.hIndex}</td></tr>
        <tr><td>i10-index</td><td>${DATA.scholarStats.i10}</td></tr></table>
    </div>
    <p class="gs-note">Synced from Google Scholar on ${DATA.scholarStats.asOf}. The live, always up-to-date list is on <a ${ext(DATA.links.scholar)}>my Google Scholar profile</a>.</p>
    <div id="gsWrap">${scholarTable()}</div>` },
  skills: { nav:"Skills", render:()=>`<h1>Skills</h1>
    <div class="sk-grid">${DATA.skills.map(g=>`<div class="sk-card" style="--c:${g.color}">
      <div class="sk-head"><span class="sk-ico">${ico(g.icon)}</span><div><div class="sk-name">${g.name}</div><div class="sk-desc">${g.desc}</div></div><span class="sk-count">${g.items.length}</span></div>
      <div class="sk-chips">${g.items.map(s=>`<span class="sk-chip">${s}</span>`).join('')}</div></div>`).join('')}</div>` },
  certificates: { nav:"Certificates", render:()=>`<h1>Certificates & Awards</h1>
    <h2>Certificates</h2><div class="cert-grid">${DATA.certificates.map(c=>`<div class="cert"><div class="cert-ico">${ico('cert')}</div><div><div class="t">${c.title}</div>${c.issuer?`<div class="m">${c.issuer}</div>`:''}${c.desc?`<div class="cd">${c.desc}</div>`:''}${c.when?`<span class="badge">${c.when}</span>`:''}${c.link?` <a ${ext(c.link)} style="font-size:.85em">Verify →</a>`:''}</div></div>`).join('')}</div>
    <h2>Honors & Awards</h2><div class="cert-grid">${DATA.awards.map(a=>`<div class="cert award"><div class="cert-ico">${ico('award')}</div><div><div class="t">${a.title}</div>${a.issuer?`<div class="m">${a.issuer}</div>`:''}${a.when?`<span class="badge">${a.when}</span>`:''}</div></div>`).join('')}</div>` },
  blog: { nav:"Blog", render:()=>`<h1>Blog</h1>${[...DATA.blog].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`
    <article class="post-full" id="post-${p.id}">
      <div class="pc-date">${fmt(p.date)}</div>
      <h2 class="pf-title">${p.title}</h2>
      ${p.image?`<img class="post-img" src="${p.image}" alt="${p.title}">`:''}
      ${p.body}
    </article>`).join('')}` }
};
document.addEventListener('click',e=>{ const s=e.target.closest('[data-sort]'); if(!s) return; e.preventDefault(); pubSort=s.dataset.sort; $('#gsWrap').innerHTML=scholarTable(); });

$('#nav').innerHTML = Object.entries(PAGES).map(([k,p])=>`<li><a href="#${k}" data-k="${k}">${p.nav}</a></li>`).join('');

function route(){
  const h = location.hash.slice(1) || 'about';
  let html, key = h;
  if(h.startsWith('post-')){
    const p = DATA.blog.find(b=>'post-'+b.id===h);
    html = p ? `<a href="#blog" class="back">← All posts</a><h1>${p.title}</h1><p style="color:var(--muted);font-size:.9em;margin-top:-.5em">${fmt(p.date)}</p>${p.image?`<img class="post-img" src="${p.image}" alt="${p.title}">`:''}${p.body}` : PAGES.blog.render();
    key = 'blog';
  } else {
    if(!PAGES[h]) key='about';
    html = PAGES[key].render();
  }
  $('#page').innerHTML = html + `<div class="pagebar">${Object.entries(PAGES).map(([k,p])=>`<a href="#${k}">${p.nav}</a>`).join(' | ')}</div>`;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===key));
  $('#nav').classList.remove('open');
  window.scrollTo(0,0);
}
addEventListener('hashchange',route); route();
const sceneSvg=document.querySelector('.scene svg');
const fitScene=()=>{ if(!sceneSvg) return; const m=innerWidth<760; sceneSvg.setAttribute('viewBox', m?'560 0 580 260':'0 0 1440 260'); sceneSvg.setAttribute('preserveAspectRatio', m?'xMinYMax slice':'xMidYMax slice'); };
addEventListener('resize',fitScene); fitScene();
$('#toggle').onclick = () => $('#nav').classList.toggle('open');
</script>
</body>
</html>
